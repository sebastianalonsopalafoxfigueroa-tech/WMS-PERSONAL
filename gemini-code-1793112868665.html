<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema WMS - Control de Almacén</title>
    <!-- Tailwind CSS para diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para escanear QR / Código de barras con la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Encabezado -->
    <header class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">WMS Almacén Personal</h1>
            <p class="text-xs text-blue-200">Sistema de Gestión de Almacenes e Inventarios en Línea</p>
        </div>
        <button onclick="reiniciarBaseDatos()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded font-semibold">
            Restablecer Datos
        </button>
    </header>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Panel Izquierdo: Escáner y Registro de Movimientos -->
        <div class="space-y-6">
            
            <!-- Escáner QR/Código de Barras -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200">
                <h2 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                    📷 Escáner de Código QR / Barras
                </h2>
                <div id="reader" class="w-full bg-gray-50 rounded-lg overflow-hidden"></div>
                <p id="scanner-result" class="mt-3 text-sm font-semibold text-blue-700 text-center">Esperando lectura...</p>
            </div>

            <!-- Formulario de Movimiento Manual / Rápido -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200">
                <h2 class="text-lg font-bold text-gray-700 mb-3">📦 Registrar Movimiento</h2>
                <form id="wms-form" onsubmit="procesarMovimiento(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600">Código SKU o Barras</label>
                        <input type="text" id="form-sku" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500" placeholder="Ej: CM-C-EAZ-CH-CA-AM1">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-600">Tipo Operación</label>
                            <select id="form-tipo" class="w-full p-2 border rounded text-sm">
                                <option value="ENTRADA">Entrada (+)</option>
                                <option value="SALIDA">Salida / Picking (-)</option>
                                <option value="UBICACION">Cambiar Ubicación</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600">Cantidad</label>
                            <input type="number" id="form-cantidad" min="1" value="1" class="w-full p-2 border rounded text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600">Nueva / Actual Ubicación</label>
                        <select id="form-ubicacion" class="w-full p-2 border rounded text-sm">
                            <option value="A-01-1">A-01-1 (Camisas)</option>
                            <option value="A-01-2">A-01-2 (Camisas)</option>
                            <option value="B-01-1">B-01-1 (Pantalones)</option>
                            <option value="B-01-2">B-01-2 (Shorts)</option>
                            <option value="C-01-1">C-01-1 (Playeras)</option>
                            <option value="D-01-1">D-01-1 (Gorras)</option>
                            <option value="E-01-1">E-01-1 (Sudaderas)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded text-sm shadow">
                        Ejecutar Operación WMS
                    </button>
                </form>
            </div>

        </div>

        <!-- Panel Derecho: Tablero de Inventario y Mapa del Almacén -->
        <div class="lg:col-span-2 space-y-6">

            <!-- KPI's / Métricas Rápidas -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-600 shadow-sm">
                    <p class="text-xs font-semibold text-blue-600">Total SKUs</p>
                    <p id="kpi-skus" class="text-2xl font-bold text-gray-800">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-lg border-l-4 border-green-600 shadow-sm">
                    <p class="text-xs font-semibold text-green-600">Unidades en Stock</p>
                    <p id="kpi-units" class="text-2xl font-bold text-gray-800">0</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg border-l-4 border-purple-600 shadow-sm">
                    <p class="text-xs font-semibold text-purple-600">Ubicaciones Activas</p>
                    <p id="kpi-locations" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>

            <!-- Tabla de Inventario en Tiempo Real -->
            <div class="bg-white p-5 rounded-lg shadow-md border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700">📋 Inventario Activo</h2>
                    <input type="text" id="search-input" onkeyup="filtrarInventario()" placeholder="Buscar SKU, Nombre..." class="p-2 border rounded text-xs w-48">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-100 text-gray-600 uppercase border-b">
                            <tr>
                                <th class="p-2">SKU</th>
                                <th class="p-2">Artículo</th>
                                <th class="p-2">Sub-Artículo</th>
                                <th class="p-2">Ubicación</th>
                                <th class="p-2">Stock</th>
                                <th class="p-2 text-center">QR</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-tbody" class="divide-y divide-gray-200">
                            <!-- Se renderiza con app.js -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
